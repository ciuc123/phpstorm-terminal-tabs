name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repo secret. While it's unset, the Marketplace step is skipped (GitHub release only).
      MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-tab-switch
          path: dist/terminal-tab-switch.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/terminal-tab-switch.zip --title "$GITHUB_REF_NAME" --generate-notes
      - name: Publish to JetBrains Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && env.MARKETPLACE_TOKEN != ''
        run: |
          curl --fail-with-body -sS -X POST https://plugins.jetbrains.com/plugin/uploadPlugin \
            -H "Authorization: Bearer $MARKETPLACE_TOKEN" \
            -F xmlId=com.ciuculescu.terminal-tab-switch \
            -F file=@dist/terminal-tab-switch.zip
